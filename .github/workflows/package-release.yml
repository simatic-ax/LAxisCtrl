# Publishes one apax package per folder in packages/ when a GitHub Release is published.
#
# Two phases prevent partial releases: every package must build before any is published.
name: Multi-package release

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write
  actions: write

jobs:
  plan:
    name: Check packages and build matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.read.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Validate release tag is SemVer
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          SEMVER_RE='^[vV]?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if [[ ! "$TAG" =~ $SEMVER_RE ]]; then
            echo "::error::Release tag '$TAG' is not valid SemVer (expected [v]MAJOR.MINOR.PATCH[-prerelease][+build])."
            exit 1
          fi

      - name: Check packages
        run: bash .github/scripts/check-packages.sh

      - id: read
        name: List packages
        run: |
          set -euo pipefail
          MATRIX=$(for f in packages/*/apax.yml; do basename "$(dirname "$f")"; done | jq -R . | jq -sc '{package: .}')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.package }}
    needs: plan
    strategy:
      fail-fast: true
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/simatic-ax/ci-images/apax-ci-image:4.4.0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Use packages/${{ matrix.package }}
        env:
          PACKAGE: ${{ matrix.package }}
        # The root lockfile belongs to the root apax.yml; a package folder may bring its own.
        run: |
          rm -f apax-lock.json
          cp -r "packages/$PACKAGE/." .

      - name: Login to required registries
        uses: simatic-ax/actions/apax-login@v4
        with:
          apax-token: ${{ secrets.APAX_TOKEN }}
          registries: |
            https://npm.pkg.github.com/,${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        uses: simatic-ax/actions/apax-install@v4

      - name: Build source code
        uses: simatic-ax/actions/apax-make@v4
        with:
          property: |
            MakeConfigName:release

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.package }}
          path: bin/release
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Publish ${{ matrix.package }}
    needs: [plan, build]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/simatic-ax/ci-images/apax-ci-image:4.4.0
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Use packages/${{ matrix.package }}
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          rm -f apax-lock.json
          cp -r "packages/$PACKAGE/." .

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.package }}
          path: bin/release

      - name: Version package
        uses: simatic-ax/actions/apax-version@v4
        with:
          version: ${{ github.event.release.tag_name }}

      - name: Package source code
        uses: simatic-ax/actions/apax-pack@v4
        with:
          key: ${{ secrets.APAX_SIGNKEY }}

      - name: Login to required registries
        uses: simatic-ax/actions/apax-login@v4
        with:
          apax-token: ${{ secrets.APAX_TOKEN }}
          registries: |
            https://npm.pkg.github.com/,${{ secrets.GITHUB_TOKEN }}

      - name: Publish apax package
        uses: simatic-ax/actions/apax-publish@v4
        with:
          registries: |
            https://npm.pkg.github.com
