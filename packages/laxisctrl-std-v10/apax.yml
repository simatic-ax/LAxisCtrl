  url: https://github.com/simatic-ax/laxisctrl

registries:
  "@simatic-ax": https://npm.pkg.github.com/

publicKeys:
  "@simatic-ax":
    "v1": "3792a7e926775425ccdd29ceed8c368c3008b5b33d7d5550b3cb1f58093e1dff"
    "v2": "7af3e394eb2b285a3d99ab8e1f745cc6db75704b30a80393339c721a92ffffd9"

catalogs:
  "@ax-as/s7-catalog": ^2610.0.0
devDependencies:
  "@ax-as/s7-sdk": ^2610.0.0
  "@simatic-ax/snippetscollection": ^1.0.0
dependencies:
  "@ax-mc/s7-motioncontrol-v10-lib": ^11.0.27
  "@ax-as/system-math-lib": ^11.0.232

scripts:
